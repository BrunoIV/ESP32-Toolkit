<style>
    .chart div {
        border-radius: 5px;
        padding: 5px 10px;
        text-align: right;
    }

    .chart p {
        margin: 10px 15px 0 0;
        display: inline-block;
    }

    .chart p::first-letter {
        color: var(--accent-color);
    }

    .chart p:last-of-type::first-letter {
        color: #ddd;
    }

    .chart span {
        float: right;
        color: #777;
        font-size: 16px;
    }

    </style>

    <div class="card chart p">
        <h2>{{CHART_TITLE}} <span>{{1}}KB of {{2}}KB used</span></h2>
        <div style="background: linear-gradient(to right, var(--accent-color) {{VAL1}}%, #ddd {{VAL2}}%)">{{FREE_STORAGE}}KB</div>
        <p>⬤ Used</p>
        <p>⬤ Free</p>
    </div>
